order_presets:
  depth: &depth_order [10, 20, 40, 60, 75, 80, 85, 90, 97, 100, 110, 120, 135, 150, 165, 185, 200]
  season: &season_order [Winter, Spring, Summer, Fall]
  renewal_phase: &renewal_phase_order [baseline, renewal, post-renewal, unknown]
  o2_compartment: &o2_compartment_order [oxic, dysoxic, suboxic, anoxic]
  o2_subcompartment_final: &o2_subcompartment_order [oxic__gmm0, oxic__gmm1, oxic__gmm2, oxic__gmm3, oxic__gmm4, dysoxic__gmm0, dysoxic__gmm1, dysoxic__gmm2, dysoxic__gmm3, dysoxic__gmm4, suboxic__gmm0, suboxic__gmm1, suboxic__gmm2, suboxic__gmm3, suboxic__gmm4, anoxic__gmm0, anoxic__gmm1, anoxic__gmm2, anoxic__gmm3, anoxic__gmm4, outlier]
  gmm_component: &gmm_component_order [0.0, 1.0, 2.0, 3.0, 4.0]

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

fastp:
  # Input primers/prefixes and primer read-through were removed by Cutadapt.
  # Disable fixed clipping to avoid removing biological sequence a second time.
  trim_front_r1: 0
  trim_tail_r1: 0
  trim_front_r2: 0
  trim_tail_r2: 0

merge:
  max_diffs: 10
  min_overlap: 100
  trunc_quality: 5
  allow_stagger: true

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 8

read_mapping:
  # Allows one substitution over 253 ungapped aligned bases; not a fixed edit-distance cap.
  min_identity: 0.995

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4
  trim_to: V4
  batch_size: 1000000
  keep_gaps: false
  threads: 25
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
  ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
  ref_sequences:
  ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
  ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
  download_subdir: taxonomy_reference
  output_dir: taxonomy
  output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
  stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
  uppercase_fasta: ASVs.upper.fasta
  threads: 25

mito:
  enabled: true
  run_mitomaster: true
  chunk_dir:
  chunk_size: 100
  mitomaster_workers: 2
  mitomaster_retries: 4
  mitomaster_timeout: 90
  mitomaster_header_mode: first
  output_dir: mito/mitomap
  prefix: nontarget
  formats: svg,pdf
  min_pident: 97.0
  min_percov: 51.0
  mitochondria_substring: mitochondria
  feature_col: "Feature ID"
  taxon_col: Taxon
  consensus_col: Consensus
  steps: "BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito"
  host_first_step: BioFactorial
  figsize: 10x6
  style: whitegrid
  dpi: 300
  no_plots: false
  blast_threads: 25
  mito_db: /home/ryan/data/ASV/refs/mito_ncbi
  biof_db: /home/ryan/data/ASV/refs/ssu_pipeline_contaminants
  mito_fasta: /home/ryan/data/ASV/refs/mito_ncbi.fasta
  contaminant_fasta: /home/ryan/data/ASV/refs/ssu_pipeline_contaminants.fasta

