  group_order: [oxic__gmm0, oxic__gmm1, oxic__gmm2, oxic__gmm3, oxic__gmm4, dysoxic__gmm0, dysoxic__gmm1, dysoxic__gmm2, dysoxic__gmm3, dysoxic__gmm4, suboxic__gmm0, suboxic__gmm1, suboxic__gmm2, suboxic__gmm3, suboxic__gmm4, anoxic__gmm0, anoxic__gmm1, anoxic__gmm2, anoxic__gmm3, anoxic__gmm4, outlier]
