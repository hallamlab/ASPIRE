# Compositionally valid genome-level co-occurrence networks for the 24 species
# represented by quality-selected genome records. Metagenomic and
# metatranscriptomic raw recruitment counts are analyzed independently.
genome_cooccurrence:
  enabled: true
  output_dir: genome_cooccurrence
  genome_qc: /home/ryan/data/Metagenomes/genomes/genome_quality_annotated.tsv
  metagenome_abundance: /home/ryan/data/SABER_SI_results/genome_qc_results/kegg-nsc_output_SAG_and_SAG-xPG/paired_quant/metag_quant/genome_abundance_long.tsv
  metatranscriptome_abundance: /home/ryan/data/SABER_SI_results/genome_qc_results/kegg-nsc_output_SAG_and_SAG-xPG/paired_quant/metat_quant/genome_abundance_long.tsv
  metadata: /home/ryan/data/biochem/basin_output/modules/biochemical_processing/tables/02_oxygen_best_available_density_RJM.tsv
  sample_col: sample_id
  genome_col: genome_id
  metagenome_value_col: read_count
  metatranscriptome_value_col: read_count
  input_scale: raw_counts
  input_feature_level: genome
  expected_species: 24
  # Experimental strong-signal analysis: genome-sample recruitment below
  # 100 raw reads is set to zero. Counts are then averaged across every
  # eligible genome in each species before closure, multiplicative zero
  # replacement, and CLR.
  minimum_read_count: 0
  metadata_sample_col: sample
  cruise_col: Cruise
  season_col: Season
  depth_col: Depth
  month_col: Month
  sample_id_regex: '^SI(?P<cruise>[0-9]+)_(?P<depth>[0-9]+(?:[.][0-9]+)?)m$'
  min_rel_abund: 0.0
  min_prevalence: 0.05
  zero_replacement_fraction: 0.65
  min_abs_rho: 0.30
  bootstrap_iterations: 1000
  min_bootstrap_recovery: 0.80
  min_sign_consistency: 0.90
  permutations: 1000
  permutation_strata:
    - Season
    - Depth
  max_q: 0.05
  seed: 10010

asv_mag_link:
  enabled: true
  master_tsv:
  genome_qc_dir: /home/ryan/data/Metagenomes/genomes
  genome_qc_dirs:
  id_token_indexes:
  barrnap_dir:
  genome_fasta_dir: /home/ryan/data/Metagenomes/genomes
  auto_barrnap: true
  output_dir: asv_mag_link
  threads: 25

  min_pident: 99.5
  min_qcov: 90.0
  asv_taxonomy_min_confidence: 0.51
  gunc_assessment_value:
  require_species_assignment: true
  # Marker eligibility is encoded and audited in genome_quality_annotated.tsv:
