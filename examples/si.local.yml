  correlation_direction: both
  ordination_methods: cca,rda,dbrda
  permutations: 999
  top_vectors: 12
  formats: pdf,png,svg

power_analysis:
  enabled: false

taxonomy_patient_aware:
  enabled: false

lung_status_analysis:
  enabled: false

clustermaps:
  enabled: true
  output_dir: clustermaps
  mito_output_dir: mito/clustermaps
  mito_input:
  isa_file: /cephfs/rjm_work/si_asv/ASPIRE_SI_V4_ncbi_output/indicspecies/
  run_mito: true
  sample_col: sampleid
  sample_code_col: sample_code
  asv_id_col: ASV_ID
  group1_col: Depth
  group2_col: Season
