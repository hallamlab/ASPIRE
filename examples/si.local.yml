paths:
  input_dir: /cephfs/rjm_work/si_asv/V4_ncbi_input
  output_dir: /cephfs/rjm_work/si_asv/ASPIRE_SI_V4_ncbi_output
  manifest: /cephfs/rjm_work/si_asv/ref_db/sample_manifest.tsv

resources:
  threads: 12
  single_end: false

palette_presets:
  depth: &depth_palette "10=#b4e1fa,20=#7cc3f2,40=#4ca3e3,60=#2171b5,75=#90ee90,80=#aaffc3,85=#aaffc3,90=#cfff70,97=#e6f542,100=#ffcc99,110=#ff9966,120=#ff6e54,135=#cc3300,150=#9900cc,165=#663399,185=#2c003e,200=#000000"
  season: &season_palette "Winter=#5b7bb2,Spring=#55a868,Summer=#e3b505,Fall=#c44e52,DJF=#5b7bb2,MAM=#55a868,JJA=#e3b505,SON=#c44e52"
  anomaly_type: &anomaly_type_palette "normal=#7f7f7f,mixing_event=#1b9e77,high_stratification=#d95f02"
  global_event_type: &global_event_type_palette "normal=#7f7f7f,mixing_event=#1b9e77,high_stratification=#d95f02"
  o2_compartment: &o2_compartment_palette "oxic=#1f78b4,suboxic=#4daf4a,dysoxic=#f28e2b,anoxic=#7b3294"
  o2_subcompartment_final: &o2_subcompartment_palette "oxic__gmm0=#1f78b4,oxic__gmm2=#4ea5d9,oxic__gmm4=#89c2e5,oxic__other=#cfe8f3,suboxic__gmm1=#4daf4a,suboxic__gmm3=#7bc87c,suboxic__other=#ccebc5,dysoxic__gmm0=#f28e2b,dysoxic__gmm3=#d95f0e,dysoxic__other=#f8c58c,anoxic__gmm1=#7b3294,anoxic__other=#c2a5cf"
  gmm_component: &gmm_component_palette "0=#1f78b4,0.0=#1f78b4,1=#33a02c,1.0=#33a02c,2=#e6ab02,2.0=#e6ab02,3=#f28e2b,3.0=#f28e2b,4=#6a3d9a,4.0=#6a3d9a"

order_presets:
  depth: &depth_order [10, 20, 40, 60, 75, 80, 85, 90, 97, 100, 110, 120, 135, 150, 165, 185, 200]
  season: &season_order [Winter, Spring, Summer, Fall]
  anomaly_type: &anomaly_type_order [normal, mixing_event, high_stratification]
  global_event_type: &global_event_type_order [normal, mixing_event, high_stratification]
  o2_compartment: &o2_compartment_order [oxic, suboxic, dysoxic, anoxic]
  o2_subcompartment_final: &o2_subcompartment_order [oxic__gmm0, oxic__gmm2, oxic__gmm4, oxic__other, suboxic__gmm1, suboxic__gmm3, suboxic__other, dysoxic__gmm0, dysoxic__gmm3, dysoxic__other, anoxic__gmm1, anoxic__other]
  gmm_component: &gmm_component_order [0.0, 1.0, 2.0, 3.0, 4.0]

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

fastp:
  trim_front_r1: 19
  trim_tail_r1: 20
  trim_front_r2: 20
  trim_tail_r2: 20

merge:
  max_diffs: 20
  min_overlap: 5
  trunc_quality: 5
  allow_stagger: true

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 3

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4
  trim_to: V4
  batch_size: 1000000
  keep_gaps: false
  threads: 16
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
  ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
  ref_sequences:
  ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
  ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
  download_subdir: taxonomy_reference
  output_dir: taxonomy
  output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
  stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
  uppercase_fasta: ASVs.upper.fasta
  threads: 16

mito:
  enabled: true
  chunk_dir:
  chunk_size: 10
  mitomaster_workers: 8
  mitomaster_retries: 4
  mitomaster_timeout: 90
  mitomaster_header_mode: first
  output_dir: mito/mitomap
  prefix: nontarget
  formats: svg,pdf
  min_pident: 97.0
  min_percov: 51.0
  mitochondria_substring: mitochondria
  feature_col: "Feature ID"
  taxon_col: Taxon
  consensus_col: Consensus
  steps: "BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito"
  host_first_step: BioFactorial
  figsize: 10x6
  style: whitegrid
  dpi: 300
  no_plots: false
  blast_threads: 16
  mito_db: /cephfs/rjm_work/si_asv/ref_db/mito_ncbi
  biof_db: /cephfs/rjm_work/si_asv/ref_db/ssu_pipeline_contaminants

filter_counts:
  enabled: true
  metadata: /cephfs/rjm_work/si_asv/ref_db/asv_cruise_metadata.tsv
  output: ASV_target.tsv
  group_col: Depth
  min_group_size: 3
  abundance_threshold: 0.005
  sample_id_col: sampleid
  min_consensus: 0.0
  taxon_col: Taxon
  consensus_col: Consensus
  biofactorial_col: BioFactorial
  mito_cols:
    - MITOMASTER
    - BLAST_mito
  save_intermediates: true
  mito_output_dir: mito/ASVs

general_stats:
  enabled: true

sankey:
  enabled: true
  metadata: /cephfs/rjm_work/si_asv/ref_db/asv_cruise_metadata.tsv
  sub_dir: .
  sample_col: sampleid
  group1_col: Depth
  color_col: Color
  keep_types:
  group_order: *depth_order
  output_prefix: metadata/data_loss_sankey
  title: Data Loss Flow
  make_labeled: true
  make_unlabeled: true

metadata_plots:
  enabled: true
  metadata: /cephfs/rjm_work/si_asv/ref_db/asv_cruise_metadata.tsv
  sub_dir: .
  sample_col: sampleid
  type_col: Depth
  color_col: Color
  biochem_assignments: /cephfs/rjm_work/basin_output/biochem_pipeline/env_o2_split_by_gmm/tables/merged_o2_split_by_gmm.csv
  biochem_sample_col: cruise_year_month_depth
  biochem_meta_join_cols: Cruise,Depth
  biochem_join_cols: Cruise,Depth_anchored
  biochem_include_cols: []
  stratification_timeseries: /cephfs/rjm_work/basin_output/biochem_pipeline/env_stratification_index/stratification_timeseries.tsv
  strat_meta_join_col: Cruise
  strat_join_col: Cruise
  strat_include_cols: []
  keep_types:
  group_order: *depth_order
  include_rank: []
  run_micro: true
  run_mito: true

batch_correction:
  enabled: true
  output_dir: batch_correction
  sample_id_col: sampleid
  batch_col: plateID
  asv_orientation: features_rows
  biological_covariates: Depth,o2_subcompartment_final
  biological_color_col: Depth,o2_subcompartment_final
  color_palette_col: Color
  conqur_mode: libsize
  conqur_num_core: 12
  conqur_batch_ref:
  conqur_logistic_lasso: false
  conqur_quantile_type: standard
  conqur_simple_match: false
  conqur_lambda_quantile: 2p/n
  conqur_interplt: false
  conqur_delta: 0.4999
  conqur_auto_install: true
  correction_policy: auto
  auto_min_sample_rho: 0.85
  auto_min_bray_rho: 0.75
  auto_max_batch_eta_ratio: 0.95
  auto_min_batch_eta_drop: 0.01
  auto_min_bio_eta_ratio: 0.70
  umap_neighbors: 15
  umap_min_dist: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples:
  hdbscan_selection_method: eom
  optimize_clustering: false
  target_clusters: 3-8
  n_features_plot: 5
  random_state: 42

outlier_detection:
  enabled: true
  output_dir: outliers_corrected
  sample_col: sampleid
  group_cols:
    - o2_subcompartment_final
    - Depth
    - Season
  transform: none
  asv_orientation: samples_rows
  pre_transformed: true
  scale: false
  use_iso: true
  use_svm: true
  use_hdb: true
  vote_threshold: 3
  iso_contamination: auto
  iso_estimators: 200
  iso_random_state: 42
  svm_kernel: rbf
  svm_gamma: scale
  svm_nu: 0.1
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 5
  hdbscan_metric: euclidean

collectors_curve:
  enabled: true
  sample_col: sampleid
  group_col: o2_subcompartment_final
  color_col: Color
  group_order: *o2_subcompartment_order
  group_palette: *o2_subcompartment_palette
  permutations: 999
  seed: 42
  out_prefix: metadata/collectors_curve
  title: "Collector's Curves"
  formats: pdf,svg
  xpad: 0.5
  max_cols: 3
  show_perms: 10
  presence_threshold: 0.0

plot_upset:
  enabled: true
  sub_dir: .
  domain: micro
  taxonomy_path:
  sample_id_col: sampleid
  group_col: o2_subcompartment_final
  color_col: Color
  group_order: *o2_subcompartment_order
  group_palette: *o2_subcompartment_palette
  subset_groups:
  skip_venn: true
  raw_only: false
  final_only: false
  formats: pdf,svg,png
  font_size: 10

bubbleplotter:
  enabled: true
  output_prefix: metadata/bubble_plot_asv
  count_col: corr_count
  sample_col: sampleid
  group1_col: o2_subcompartment_final
  group2_col: Depth
  color_col: Color
  group1_order: *o2_subcompartment_order
  group2_order: *depth_order
  formats: pdf,png,svg
  figsize: "32,60"
  bubble_scale: 10
  no_auto_size: false

umap_clustering:
  enabled: true
  output_prefix: metadata/umap_clustering
  sample_col: sampleid
  count_col: corr_count
  group1_col: o2_subcompartment_final
  group2_col: Depth
  color_col: Color
  group1_order: *o2_subcompartment_order
  group2_order: *depth_order
  group1_palette: *o2_subcompartment_palette
  group2_palette: *depth_palette
  formats: pdf,png,svg
  normalize: clr
  transform: sqrt
  no_scale: true
  n_neighbors: 15
  min_dist: 0.1
  umap_metric: cosine
  min_cluster_size: 10
  min_samples: 5
  hdbscan_metric: euclidean

diversity:
  enabled: true
  output_dir: diversity
  mito_output_dir: mito/diversity
  mito_input:
  sample_col: sampleid
  group_col: o2_subcompartment_final
  group1_col: o2_subcompartment_final
  group2_col: Depth
  color_col: Color
  block_col: Cruise
  secondary_col: Depth
  exclude_groups: []
  group_order: *o2_subcompartment_order
  group1_palette: *o2_subcompartment_palette
  group2_palette: *depth_palette
  run_mito: true
  umap_neighbors: 30
  umap_min_dist: 0.01
  permanova_perms: 999
  random_state: 42
  verbose: true
  patient_aware:
    enabled: false

indicspecies:
  enabled: true
  sample_col: sampleid
  color_col: Color
  block_col: Cruise
  group_cols:
    - anomaly_type
    - global_event_type
    - o2_subcompartment_final
    - o2_compartment
    - gmm_component
  group_palettes:
    anomaly_type: *anomaly_type_palette
    global_event_type: *global_event_type_palette
    o2_subcompartment_final: *o2_subcompartment_palette
    o2_compartment: *o2_compartment_palette
    gmm_component: *gmm_component_palette
  group_orders:
    anomaly_type: *anomaly_type_order
    global_event_type: *global_event_type_order
    o2_subcompartment_final: *o2_subcompartment_order
    o2_compartment: *o2_compartment_order
    gmm_component: *gmm_component_order
  focus_labels: {}
  perms: 999
  min_n: 2
  plot_enabled: true
  plot_pairs_mode: all
  plot_output_dir: indicspecies/plots
  use_duleg: true
  aligned_plot_enabled: false
  aligned_plot_output_dir: indicspecies/aligned
  aligned_alpha: 0.05
  aligned_min_stat: 0.0
  aligned_top_n: 25
  venn:
  taxonomy: /cephfs/rjm_work/si_asv/ASPIRE_SI_V4_ncbi_output/taxonomy/ASV_SILVA_tax.full-length.vsearch.tsv

voc_correlation:
  enabled: false

measurement_association:
  enabled: true
  output_dir: measurement_association
  measurement_table: /cephfs/rjm_work/basin_output/biochem_pipeline/biochem_processing/02_oxygen_best_available.tsv
  sample_col: sampleid
  asv_id_col: ASV_ID
  measurement_sample_col: sampleid
  metadata_join_cols: [Cruise, Depth]
  measurement_join_cols: [Cruise, Depth]
