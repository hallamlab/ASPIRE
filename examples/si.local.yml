# Local SI run configuration for ASPIRE.
#
# Edit the anchors in this first block for a new machine. YAML anchors work as
# shared scalar values, but YAML does not concatenate strings, so full derived
# paths need their own anchors.
x_si_paths:
  input_dir: &si_input_dir /cephfs/rjm_work/si_asv/V4_ncbi_input
  output_dir: &si_output_dir /cephfs/rjm_work/si_asv/ASPIRE_SI_V4_ncbi_output
  runtime_dir: &si_runtime_dir /cephfs/rjm_work/si_asv/ASPIRE_SI_V4_ncbi_output/.aspire
  manifest: &si_manifest /cephfs/rjm_work/si_asv/ref_db/sample_manifest.tsv
  metadata: &si_metadata /cephfs/rjm_work/si_asv/ref_db/asv_cruise_metadata.tsv
  taxonomy_tsv: &si_taxonomy_tsv /cephfs/rjm_work/si_asv/ASPIRE_SI_V4_ncbi_output/taxonomy/ASV_SILVA_tax.full-length.vsearch.tsv
  mito_fasta: &si_mito_fasta /cephfs/rjm_work/si_asv/ref_db/mito_ncbi.fasta
  contaminant_fasta: &si_contaminant_fasta /cephfs/rjm_work/si_asv/ref_db/ssu_pipeline_contaminants.fasta
  mito_db: &si_mito_db /cephfs/rjm_work/si_asv/ref_db/mito_ncbi
  contaminant_db: &si_contaminant_db /cephfs/rjm_work/si_asv/ref_db/ssu_pipeline_contaminants
  basin_output: &si_basin_output /cephfs/rjm_work/basin_output/biochem_pipeline
  basin_assignments: &si_basin_assignments /cephfs/rjm_work/basin_output/biochem_pipeline/env_o2_split_by_gmm/tables/merged_o2_split_by_gmm.csv
  basin_stratification: &si_basin_stratification /cephfs/rjm_work/basin_output/biochem_pipeline/env_stratification_index/stratification_timeseries.tsv
  basin_measurements: &si_basin_measurements /cephfs/rjm_work/basin_output/biochem_pipeline/biochem_processing/02_oxygen_best_available.tsv
  indicspecies_dir: &si_indicspecies_dir /cephfs/rjm_work/si_asv/ASPIRE_SI_V4_ncbi_output/indicspecies/
  mag_selected_set: &si_mag_selected_set /media/nfs/Ryan/SABer/SI_data/SI_METAGs/SABer_260109/genome_qc_results/elemental_cycles/nitrogen/sag_xpg_species_phylogenies/M00529_Denitrification_nitrate_nitrogen_filtered_cohort_bacterial_mq_16s_gt0.5/selected_set
  mag_functional_modules: &si_mag_functional_modules /home/ryan/SABer_dat/SI_data/SI_METAGs/SABer_260109/genome_qc_results/SI_kofam.module.bin_summary.tsv

paths:
  input_dir: *si_input_dir
  output_dir: *si_output_dir
  manifest: *si_manifest
  runtime_dir: *si_runtime_dir
  keep_runtime_dir: true

resources:
  threads: 12
  single_end: false

palette_presets:
  depth: &depth_palette "10=#b4e1fa,20=#7cc3f2,40=#4ca3e3,60=#2171b5,75=#90ee90,80=#aaffc3,85=#aaffc3,90=#cfff70,97=#e6f542,100=#ffcc99,110=#ff9966,120=#ff6e54,135=#cc3300,150=#9900cc,165=#663399,185=#2c003e,200=#000000"
  season: &season_palette "Winter=#5b7bb2,Spring=#55a868,Summer=#e3b505,Fall=#c44e52,DJF=#5b7bb2,MAM=#55a868,JJA=#e3b505,SON=#c44e52"
  anomaly_type: &anomaly_type_palette "normal=#7f7f7f,mixing_event=#1b9e77,high_stratification=#d95f02"
  global_event_type: &global_event_type_palette "normal=#7f7f7f,mixing_event=#1b9e77,high_stratification=#d95f02"
  o2_compartment: &o2_compartment_palette "oxic=#1f78b4,suboxic=#4daf4a,dysoxic=#f28e2b,anoxic=#7b3294"
  o2_subcompartment_final: &o2_subcompartment_palette "oxic__gmm0=#1f78b4,oxic__gmm2=#4ea5d9,oxic__gmm4=#89c2e5,oxic__other=#cfe8f3,suboxic__gmm1=#4daf4a,suboxic__gmm3=#7bc87c,suboxic__other=#ccebc5,dysoxic__gmm0=#f28e2b,dysoxic__gmm3=#d95f0e,dysoxic__other=#f8c58c,anoxic__gmm1=#7b3294,anoxic__other=#c2a5cf"
  gmm_component: &gmm_component_palette "0=#1f78b4,0.0=#1f78b4,1=#33a02c,1.0=#33a02c,2=#e6ab02,2.0=#e6ab02,3=#f28e2b,3.0=#f28e2b,4=#6a3d9a,4.0=#6a3d9a"

order_presets:
  depth: &depth_order [10, 20, 40, 60, 75, 80, 85, 90, 97, 100, 110, 120, 135, 150, 165, 185, 200]
  season: &season_order [Winter, Spring, Summer, Fall]
  anomaly_type: &anomaly_type_order [normal, mixing_event, high_stratification]
  global_event_type: &global_event_type_order [normal, mixing_event, high_stratification]
  o2_compartment: &o2_compartment_order [oxic, suboxic, dysoxic, anoxic]
  o2_subcompartment_final: &o2_subcompartment_order [oxic__gmm0, oxic__gmm2, oxic__gmm4, oxic__other, suboxic__gmm1, suboxic__gmm3, suboxic__other, dysoxic__gmm0, dysoxic__gmm3, dysoxic__other, anoxic__gmm1, anoxic__other]
  gmm_component: &gmm_component_order [0.0, 1.0, 2.0, 3.0, 4.0]

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

fastp:
  trim_front_r1: 19
  trim_tail_r1: 20
  trim_front_r2: 20
  trim_tail_r2: 20

merge:
  max_diffs: 20
  min_overlap: 5
  trunc_quality: 5
  allow_stagger: true

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 3

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4
  trim_to: V4
  batch_size: 1000000
  keep_gaps: false
  threads: 16
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
