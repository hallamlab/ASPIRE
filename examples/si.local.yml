# Local SI run configuration for ASPIRE.
#
# Edit the anchors in this first block for a new machine. YAML anchors work as
# shared scalar values, but YAML does not concatenate strings, so full derived
# paths need their own anchors.
x_si_paths:
  input_dir: &si_input_dir /data/home/ryan/data/ASV/SI_fastq_primer_trimmed/trimmed
  output_dir: &si_output_dir /data/home/ryan/data/ASV/aspire_output_primer_trimmed
  runtime_dir: &si_runtime_dir /data/home/ryan/data/ASV/aspire_output_primer_trimmed/.aspire
  manifest: &si_manifest /data/home/ryan/repos/ASPIRE/examples/si.primer_trimmed.manifest.tsv
  metadata: &si_metadata /home/ryan/data/ASV/refs/asv_cruise_metadata.tsv
  taxonomy_tsv: &si_taxonomy_tsv /data/home/ryan/data/ASV/aspire_output_primer_trimmed/.aspire/publication_staging/taxonomy/ASV_SILVA_tax.full-length.vsearch.tsv
  mito_fasta: &si_mito_fasta /home/ryan/data/ASV/refs/mito_ncbi.fasta
  contaminant_fasta: &si_contaminant_fasta /home/ryan/data/ASV/refs/ssu_pipeline_contaminants.fasta
  mito_db: &si_mito_db /home/ryan/data/ASV/refs/mito_ncbi
  contaminant_db: &si_contaminant_db /home/ryan/data/ASV/refs/ssu_pipeline_contaminants
  basin_output: &si_basin_output /home/ryan/data/biochem/basin_output
  basin_assignments: &si_basin_assignments /home/ryan/data/biochem/basin_output/modules/oxygen_gmm_subcompartments/tables/merged_o2_split_by_gmm.csv
  basin_stratification: &si_basin_stratification /home/ryan/data/biochem/basin_output/modules/stratification/tables/stratification_physical_biochem_timeseries.tsv
  basin_measurements: &si_basin_measurements /home/ryan/data/biochem/basin_output/modules/biochemical_processing/tables/02_oxygen_best_available_density_RJM.tsv
  indicspecies_dir: &si_indicspecies_dir /data/home/ryan/data/ASV/aspire_output_primer_trimmed/.aspire/publication_staging/indicspecies
  mag_selected_set: &si_mag_selected_set /home/ryan/data/Metagenomes/genomes
  mag_functional_modules: &si_mag_functional_modules /home/ryan/data/SABER_SI_results/genome_qc_results/kegg-nsc_output_SAG_and_SAG-xPG/module_calls.tsv

paths:
  input_dir: /data/home/ryan/data/ASV/SI_fastq_primer_trimmed/trimmed
  output_dir: /data/home/ryan/data/ASV/aspire_output_primer_trimmed
  manifest: /data/home/ryan/repos/ASPIRE/examples/si.primer_trimmed.manifest.tsv
  runtime_dir: /data/home/ryan/data/ASV/aspire_output_primer_trimmed/.aspire
  keep_runtime_dir: true

resources:
  sample_threads: 1
  analysis_threads: 25
  max_parallel_sample_tasks: 32
  single_end: false

palette_presets:
  depth: &depth_palette "10=#b4e1fa,20=#7cc3f2,40=#4ca3e3,60=#2171b5,75=#90ee90,80=#aaffc3,85=#aaffc3,90=#cfff70,97=#e6f542,100=#ffcc99,110=#ff9966,120=#ff6e54,135=#cc3300,150=#9900cc,165=#663399,185=#2c003e,200=#000000"
  season: &season_palette "Winter=#5b7bb2,Spring=#55a868,Summer=#e3b505,Fall=#c44e52,DJF=#5b7bb2,MAM=#55a868,JJA=#e3b505,SON=#c44e52"
  renewal_phase: &renewal_phase_palette "baseline=#7f7f7f,renewal=#0072B2,post-renewal=#E69F00,unknown=#BDBDBD"
  o2_compartment: &o2_compartment_palette "oxic=#FF0000,dysoxic=#008000,suboxic=#ADD8E6,anoxic=#800080"
  o2_subcompartment_final: &o2_subcompartment_palette "oxic__gmm0=#660000,oxic__gmm1=#D40000,oxic__gmm2=#FF4444,oxic__gmm3=#FFB2B2,dysoxic__gmm0=#003300,dysoxic__gmm1=#8CFF8C,suboxic__gmm0=#26667C,suboxic__gmm1=#3897B7,suboxic__gmm2=#6AB8D1,suboxic__gmm3=#A5D4E3,suboxic__gmm4=#E0F0F5,anoxic__gmm0=#330033,anoxic__gmm1=#890089,anoxic__gmm2=#DF00DF,anoxic__gmm3=#FF36FF,anoxic__gmm4=#FF8CFF,outlier=#FFFFFF"
