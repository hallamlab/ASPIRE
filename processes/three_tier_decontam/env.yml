name: aspire_three_tier_decontam
channels:
  - conda-forge
  - bioconda
dependencies:
  # Qualify channels so user-level Conda channels cannot shadow these packages
  # when the controller enforces strict channel priority.
  - conda-forge::python=3.11
  - conda-forge::pandas
  - conda-forge::r-base=4.3
  - conda-forge::r-optparse
  - conda-forge::r-ggplot2
  # Bioconductor 3.18 / R 4.3 build.
  - bioconda::bioconductor-decontam=1.22.0
