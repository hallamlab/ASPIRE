name: asv_controller
channels:
  - conda-forge
  - bioconda
dependencies:
  - jq
  # Pin the launcher package; run_asv_pipeline.sh pins the engine to 25.10.0.
  # Nextflow 26 switches to a stricter parser and is not yet supported.
  - nextflow=25.10.4
  - mamba
  - openjdk>=17,<27
  - pandas
  - pyyaml
  - yq
