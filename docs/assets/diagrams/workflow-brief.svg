<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 1610" width="2240" height="1610" role="img"><title>Workflow Brief</title><rect width="2240" height="1610" fill="#ffffff" /><svg width="1000" height="1570" viewBox="0 0 1000 1570" role="img" aria-labelledby="title desc" x="620" y="20"><title id="title">ASPIRE workflow overview</title><desc id="desc">Amplicon reads become ASVs and taxonomy, then microbial tables after configured non-target and optional control-based decontamination. Enabled ecology, association, network and genome-link analyses produce tables, figures and an integrated run report. Conceptual modules, not a serial execution schedule.</desc><rect width="1000" height="1570" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" /></marker></defs><style>text{font-family:"Times New Roman",Times,serif;fill:#111111}.wire{fill:none;stroke:#111111;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect x="20" y="20" width="960" height="80" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5" />
<text x="500" y="54" font-size="29" text-anchor="middle"><tspan x="500" dy="0">ASPIRE • Amplicon analysis with Nextflow</tspan></text>
<text x="500" y="84" font-size="21" text-anchor="middle"><tspan x="500" dy="0">Mamba environments • Resource controls • Checkpoints and logs</tspan></text>
<g id="workflow-inputs-and-legend"><rect x="20" y="120" width="550" height="130" rx="16" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" /><text x="40" y="150" font-size="24" text-anchor="start">Inputs</text><text x="40" y="179" font-size="18" text-anchor="start">Amplicon FASTQs + sample IDs / manifest</text><text x="40" y="205" font-size="18" text-anchor="start">Taxonomy references + sample metadata</text><text x="40" y="231" font-size="18" text-anchor="start">As enabled: controls, screening references and VOCs</text><rect x="590" y="120" width="390" height="130" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5" /><text x="629" y="157" font-size="18" text-anchor="middle">Module</text><rect x="617" y="186" width="24" height="24" fill="#F5F5F5" stroke="#111111" stroke-width="1.5" /><text x="704" y="157" font-size="18" text-anchor="middle">Compute</text><path d="M 704 185 L 717 198 L 704 211 L 691 198 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" /><text x="779" y="157" font-size="18" text-anchor="middle">Data</text><circle cx="779" cy="198" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" /><text x="854" y="157" font-size="18" text-anchor="middle">Input</text><circle cx="854" cy="198" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" /><text x="929" y="157" font-size="18" text-anchor="middle">Output</text><circle cx="929" cy="198" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" /></g><g id="workflow-modules" transform="translate(0 180)"><text x="125" y="198" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Read QC and</tspan><tspan x="125" dy="25.99">ASV processing</tspan></text>
<rect x="230" y="197" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" />
<text x="243" y="217" font-size="20" text-anchor="middle"><tspan x="243" dy="0">1</tspan></text>
<circle cx="350" cy="210" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" />
<text x="350" y="146" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Paired-end</tspan><tspan x="350" dy="23.729999999999997">amplicon reads</tspan></text>
<path d="M 257.5 210 L 336.5 210" class="wire" /><path d="M 363.5 210 L 564.879 210" class="wire" />
<path d="M 580 197 L 593 210 L 580 223 L 567 210 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="580" y="146" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Trim, merge and filter;</tspan><tspan x="580" dy="25.99">denoise and remove chimeras</tspan></text>
<path d="M 595.121 210 L 866.5 210" class="wire" />
<circle cx="880" cy="210" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" />
<text x="880" y="146" font-size="23" text-anchor="middle"><tspan x="880" dy="0">ASV sequences</tspan><tspan x="880" dy="25.99">and count matrix</tspan></text>
<text x="580" y="252" font-size="18" text-anchor="middle"><tspan x="580" dy="0">fastp • VSEARCH • Read-to-ASV mapping</tspan></text>
<text x="125" y="403" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Taxonomy and</tspan><tspan x="125" dy="25.99">background removal</tspan></text>
<rect x="230" y="402" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" />
<text x="243" y="422" font-size="20" text-anchor="middle"><tspan x="243" dy="0">2</tspan></text>
<circle cx="350" cy="415" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="350" y="351" font-size="21" text-anchor="middle"><tspan x="350" dy="0">ASVs and</tspan><tspan x="350" dy="23.729999999999997">reference databases</tspan></text>
<path d="M 257.5 415 L 336.5 415" class="wire" /><path d="M 363.5 415 L 564.879 415" class="wire" />
<path d="M 580 402 L 593 415 L 580 428 L 567 415 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="580" y="351" font-size="23" text-anchor="middle"><tspan x="580" dy="0">SINA / QIIME 2 taxonomy;</tspan><tspan x="580" dy="25.99">mitochondrial / host screens</tspan></text>
<path d="M 595.121 415 L 866.5 415" class="wire" />
<circle cx="880" cy="415" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" />
<text x="880" y="351" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Taxonomy and</tspan><tspan x="880" dy="25.99">microbial counts</tspan></text>
<text x="580" y="457" font-size="18" text-anchor="middle"><tspan x="580" dy="0">BLAST / optional MITOMASTER • Configured taxon and abundance filters</tspan></text>
<text x="125" y="608" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Metadata and</tspan><tspan x="125" dy="25.99">quality assessment</tspan></text>
<rect x="230" y="607" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" />
<text x="243" y="627" font-size="20" text-anchor="middle"><tspan x="243" dy="0">3</tspan></text>
<circle cx="350" cy="620" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="350" y="556" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Counts, controls</tspan><tspan x="350" dy="23.729999999999997">and sample metadata</tspan></text>
<path d="M 257.5 620 L 336.5 620" class="wire" /><path d="M 363.5 620 L 564.879 620" class="wire" />
<path d="M 580 607 L 593 620 L 580 633 L 567 620 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="580" y="556" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Join metadata, subtract</tspan><tspan x="580" dy="25.99">controls; optional decontam</tspan></text>
<path d="M 595.121 620 L 866.5 620" class="wire" />
<circle cx="880" cy="620" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" />
<text x="880" y="556" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Selected tables</tspan><tspan x="880" dy="25.99">and retention audits</tspan></text>
<text x="580" y="662" font-size="18" text-anchor="middle"><tspan x="580" dy="0">Control prevalence / frequency / plausibility • Sankey / Venn / UpSet</tspan></text>
<text x="125" y="813" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Community</tspan><tspan x="125" dy="25.99">structure / diversity</tspan></text>
<rect x="230" y="812" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" />
<text x="243" y="832" font-size="20" text-anchor="middle"><tspan x="243" dy="0">4</tspan></text>
<circle cx="350" cy="825" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="350" y="761" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Selected counts</tspan><tspan x="350" dy="23.729999999999997">and study groups</tspan></text>
<path d="M 257.5 825 L 336.5 825" class="wire" /><path d="M 363.5 825 L 564.879 825" class="wire" />
<path d="M 580 812 L 593 825 L 580 838 L 567 825 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="580" y="761" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Alpha: Shannon</tspan><tspan x="580" dy="25.99">Beta: Bray–Curtis / Jaccard</tspan></text>
<path d="M 595.121 825 L 866.5 825" class="wire" />
<circle cx="880" cy="825" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" />
<text x="880" y="761" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Diversity and</tspan><tspan x="880" dy="25.99">group comparisons</tspan></text>
<text x="580" y="867" font-size="18" text-anchor="middle"><tspan x="580" dy="0">Collector curves • UMAP / outliers • PERMANOVA / PERMDISP¹</tspan></text>
<text x="125" y="1018" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Indicators and</tspan><tspan x="125" dy="25.99">microbial networks</tspan></text>
<rect x="230" y="1017" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" />
<text x="243" y="1037" font-size="20" text-anchor="middle"><tspan x="243" dy="0">5</tspan></text>
<circle cx="350" cy="1030" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="350" y="966" font-size="21" text-anchor="middle"><tspan x="350" dy="0">ASV tables and</tspan><tspan x="350" dy="23.729999999999997">study metadata</tspan></text>
<path d="M 257.5 1030 L 336.5 1030" class="wire" /><path d="M 363.5 1030 L 564.879 1030" class="wire" />
<path d="M 580 1017 L 593 1030 L 580 1043 L 567 1030 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="580" y="966" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Indicator species;</tspan><tspan x="580" dy="25.99">SPIEC-EASI and modules</tspan></text>
<path d="M 595.121 1030 L 866.5 1030" class="wire" />
<circle cx="880" cy="1030" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" />
<text x="880" y="966" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Associated taxa</tspan><tspan x="880" dy="25.99">and network structure</tspan></text>
<text x="580" y="1072" font-size="18" text-anchor="middle"><tspan x="580" dy="0">indicspecies • FDR • Taxonomic clustermaps • Annotated networks</tspan></text>
<text x="125" y="1223" font-size="23" text-anchor="middle"><tspan x="125" dy="0">ASV–VOC</tspan><tspan x="125" dy="25.99">integration</tspan></text>
<rect x="230" y="1222" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" />
<text x="243" y="1242" font-size="20" text-anchor="middle"><tspan x="243" dy="0">6</tspan></text>
<circle cx="350" cy="1235" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="350" y="1171" font-size="21" text-anchor="middle"><tspan x="350" dy="0">ASVs, VOCs and</tspan><tspan x="350" dy="23.729999999999997">participant metadata</tspan></text>
<path d="M 257.5 1235 L 336.5 1235" class="wire" /><path d="M 363.5 1235 L 564.879 1235" class="wire" />
<path d="M 580 1222 L 593 1235 L 580 1248 L 567 1235 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" />
<text x="580" y="1171" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Participant-level Spearman</tspan><tspan x="580" dy="25.99">and permutation tests</tspan></text>
<path d="M 595.121 1235 L 866.5 1235" class="wire" />
<circle cx="880" cy="1235" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" />
<text x="880" y="1171" font-size="23" text-anchor="middle"><tspan x="880" dy="0">ASV–VOC links</tspan><tspan x="880" dy="25.99">and VOC contrasts</tspan></text>
<text x="580" y="1277" font-size="18" text-anchor="middle"><tspan x="580" dy="0">Relative abundance / CLR sensitivity • BH correction • Heatmaps</tspan></text>
<rect x="20" y="1310" width="960" height="60" rx="12" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5" />
<text x="500" y="1337" font-size="23" text-anchor="middle"><tspan x="500" dy="0">Integrated tables, figures, run report and provenance</tspan></text>
<text x="500" y="1360" font-size="17" text-anchor="middle"><tspan x="500" dy="0">¹ Patient-aware tests and optional modules depend on configuration.</tspan></text>
<path d="M 243 224 L 243 401" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" class="module-flow" /><path d="M 243 429 L 243 606" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" class="module-flow" /><path d="M 243 634 L 243 811" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" class="module-flow" /><path d="M 243 839 L 243 1016" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" class="module-flow" /><path d="M 243 1044 L 243 1221" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" class="module-flow" /></g></svg></svg>
