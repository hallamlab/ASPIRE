<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 1425" width="2240" height="1425" role="img"><title>Workflow Brief</title><rect width="2240" height="1425" fill="#ffffff" /><svg width="1500" height="1385" viewBox="0 0 1500 1385" role="img" aria-labelledby="title desc" data-workflow-style="mp-nodal-v1" x="370" y="20"><title id="title">ASPIRE: amplicon analysis workflow</title><desc id="desc">Numbered conceptual modules use the MetaPathways nodal style. Shared read processing and full taxonomy precede control decontamination and final feature filtering. Diversity keeps the full biological cohort; selected groups feed other analyses. Module numbers are not a serial execution schedule.</desc><rect width="1500" height="1385" fill="#FFFFFF" /><style>text{font-family:"Times New Roman",Times,serif;fill:#111111}.wire{fill:none;stroke:#111111;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#111111" /></marker></defs><rect x="20" y="20" width="1460" height="80" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5" /><text x="750" y="54" font-size="29" text-anchor="middle"><tspan x="750" dy="0">ASPIRE • Amplicon analysis with Nextflow</tspan></text><text x="750" y="83" font-size="21" text-anchor="middle"><tspan x="750" dy="0">Mamba environments • Resource controls • Resumable execution • Audited outputs</tspan></text><rect x="20" y="120" width="770" height="130" rx="16" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" /><text x="42" y="152" font-size="25" text-anchor="start"><tspan x="42" dy="0">Inputs</tspan></text><text x="42" y="181" font-size="21" text-anchor="start"><tspan x="42" dy="0">Paired amplicon reads, sample manifest, metadata and references</tspan><tspan x="42" dy="24.15">Configured biological / TECH / BIO sample classes</tspan><tspan x="42" dy="24.15">Optional: VOC measurements and genome references</tspan></text><rect x="820" y="120" width="660" height="100" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5" /><text x="880" y="150" font-size="21" text-anchor="middle"><tspan x="880" dy="0">Module</tspan></text><rect x="867" y="170" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="1010" y="150" font-size="21" text-anchor="middle"><tspan x="1010" dy="0">Compute</tspan></text><path d="M1010 170 L1023 183 L1010 196 L997 183Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1140" y="150" font-size="21" text-anchor="middle"><tspan x="1140" dy="0">Data</tspan></text><circle cx="1140" cy="183" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="data" /><text x="1270" y="150" font-size="21" text-anchor="middle"><tspan x="1270" dy="0">Input</tspan></text><circle cx="1270" cy="183" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="1400" y="150" font-size="21" text-anchor="middle"><tspan x="1400" dy="0">Output</tspan></text><circle cx="1400" cy="183" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="140" y="337" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Reads</tspan><tspan x="140" dy="31.049999999999997">&amp; ASVs</tspan></text><rect x="277" y="332" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="352" font-size="20" text-anchor="middle"><tspan x="290" dy="0">1</tspan></text><circle cx="430" cy="345" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="279" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Reads, metadata</tspan><tspan x="430" dy="24.15">and references</tspan></text><circle cx="1370" cy="345" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="279" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Raw ASVs</tspan><tspan x="1370" dy="24.15">and taxonomy</tspan></text><path d="M304.5 345 L416.5 345" class="wire" /><path d="M650 332 L663 345 L650 358 L637 345Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="279" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Primer trimming</tspan><tspan x="650" dy="24.15">and read QC</tspan></text><text x="650" y="382" font-size="19" text-anchor="middle"><tspan x="650" dy="0">Cutadapt / fastp</tspan></text><path d="M443.5 345 L635 345" class="wire" /><path d="M920 332 L933 345 L920 358 L907 345Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="279" font-size="21" text-anchor="middle"><tspan x="920" dy="0">ASV construction</tspan></text><text x="920" y="382" font-size="19" text-anchor="middle"><tspan x="920" dy="0">VSEARCH</tspan></text><path d="M665 345 L905 345" class="wire" /><path d="M1160 332 L1173 345 L1160 358 L1147 345Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="279" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Full taxonomy</tspan></text><text x="1160" y="382" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">SINA / QIIME 2</tspan></text><path d="M935 345 L1145 345" class="wire" /><path d="M1175 345 L1356.5 345" class="wire" /><path d="M290 359.5 L290 505.5" class="wire" /><text x="140" y="512" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Control</tspan><tspan x="140" dy="31.049999999999997">decontamination</tspan></text><rect x="277" y="507" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="527" font-size="20" text-anchor="middle"><tspan x="290" dy="0">2</tspan></text><circle cx="430" cy="520" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="454" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Raw counts and</tspan><tspan x="430" dy="24.15">sample classes</tspan></text><circle cx="1370" cy="520" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="454" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Biological</tspan><tspan x="1370" dy="24.15">counts</tspan></text><path d="M304.5 520 L416.5 520" class="wire" /><path d="M650 507 L663 520 L650 533 L637 520Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="454" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Biological-only</tspan><tspan x="650" dy="24.15">depth QC</tspan></text><text x="650" y="557" font-size="19" text-anchor="middle"><tspan x="650" dy="0">ASPIRE / pandas</tspan></text><path d="M443.5 520 L635 520" class="wire" /><path d="M920 507 L933 520 L920 533 L907 520Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="454" font-size="21" text-anchor="middle"><tspan x="920" dy="0">TECH / BIO</tspan><tspan x="920" dy="24.15">prevalence</tspan></text><text x="920" y="557" font-size="19" text-anchor="middle"><tspan x="920" dy="0">decontam</tspan></text><path d="M665 520 L905 520" class="wire" /><path d="M1160 507 L1173 520 L1160 533 L1147 520Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="454" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Union ASV</tspan><tspan x="1160" dy="24.15">removal</tspan></text><text x="1160" y="557" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">ASPIRE / pandas</tspan></text><path d="M935 520 L1145 520" class="wire" /><path d="M1175 520 L1356.5 520" class="wire" /><path d="M290 534.5 L290 680.5" class="wire" /><text x="140" y="687" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Microbial</tspan><tspan x="140" dy="31.049999999999997">feature selection</tspan></text><rect x="277" y="682" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="702" font-size="20" text-anchor="middle"><tspan x="290" dy="0">3</tspan></text><circle cx="430" cy="695" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="629" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Counts, taxonomy</tspan><tspan x="430" dy="24.15">and references</tspan></text><circle cx="1370" cy="695" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="629" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Final microbial</tspan><tspan x="1370" dy="24.15">counts and FASTA</tspan></text><path d="M304.5 695 L416.5 695" class="wire" /><path d="M650 682 L663 695 L650 708 L637 695Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="629" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Non-target</tspan><tspan x="650" dy="24.15">screening</tspan></text><text x="650" y="732" font-size="19" text-anchor="middle"><tspan x="650" dy="0">MITOMASTER / BLAST+</tspan></text><path d="M443.5 695 L635 695" class="wire" /><path d="M920 682 L933 695 L920 708 L907 695Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="629" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Abundance /</tspan><tspan x="920" dy="24.15">prevalence filters</tspan></text><text x="920" y="732" font-size="19" text-anchor="middle"><tspan x="920" dy="0">ASPIRE / pandas</tspan></text><path d="M665 695 L905 695" class="wire" /><path d="M1160 682 L1173 695 L1160 708 L1147 695Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="629" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Taxonomy</tspan><tspan x="1160" dy="24.15">exclusions</tspan></text><text x="1160" y="732" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">ASPIRE / pandas</tspan></text><path d="M935 695 L1145 695" class="wire" /><path d="M1175 695 L1356.5 695" class="wire" /><path d="M290 709.5 L290 855.5" class="wire" /><text x="140" y="862" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Metadata</tspan><tspan x="140" dy="31.049999999999997">&amp; cohorts</tspan></text><rect x="277" y="857" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="877" font-size="20" text-anchor="middle"><tspan x="290" dy="0">4</tspan></text><circle cx="430" cy="870" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="804" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Final counts</tspan><tspan x="430" dy="24.15">and metadata</tspan></text><circle cx="1370" cy="870" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="804" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Diversity and</tspan><tspan x="1370" dy="24.15">selected tables</tspan></text><path d="M304.5 870 L416.5 870" class="wire" /><path d="M650 857 L663 870 L650 883 L637 870Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="804" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Linked metadata</tspan><tspan x="650" dy="24.15">and preparation</tspan></text><text x="650" y="907" font-size="19" text-anchor="middle"><tspan x="650" dy="0">pandas / ConQuR</tspan></text><path d="M443.5 870 L635 870" class="wire" /><path d="M920 857 L933 870 L920 883 L907 870Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="804" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Full-cohort</tspan><tspan x="920" dy="24.15">diversity</tspan></text><text x="920" y="907" font-size="19" text-anchor="middle"><tspan x="920" dy="0">scikit-bio / vegan</tspan></text><path d="M665 870 L905 870" class="wire" /><path d="M1160 857 L1173 870 L1160 883 L1147 870Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="804" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Study groups for</tspan><tspan x="1160" dy="24.15">other analyses</tspan></text><text x="1160" y="907" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">ASPIRE / pandas</tspan></text><path d="M935 870 L1145 870" class="wire" /><path d="M1175 870 L1356.5 870" class="wire" /><path d="M290 884.5 L290 1030.5" class="wire" /><text x="140" y="1037" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Analyses</tspan><tspan x="140" dy="31.049999999999997">&amp; integration</tspan></text><rect x="277" y="1032" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="1052" font-size="20" text-anchor="middle"><tspan x="290" dy="0">5</tspan></text><circle cx="430" cy="1045" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="979" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Selected tables;</tspan><tspan x="430" dy="24.15">VOCs / genomes</tspan></text><circle cx="1370" cy="1045" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="979" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Analysis tables</tspan><tspan x="1370" dy="24.15">and figures</tspan></text><path d="M304.5 1045 L416.5 1045" class="wire" /><path d="M650 1032 L663 1045 L650 1058 L637 1045Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="979" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Indicators /</tspan><tspan x="650" dy="24.15">patient tests</tspan></text><text x="650" y="1082" font-size="19" text-anchor="middle"><tspan x="650" dy="0">indicspecies / vegan</tspan></text><path d="M443.5 1045 L635 1045" class="wire" /><path d="M920 1032 L933 1045 L920 1058 L907 1045Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="979" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Associations</tspan><tspan x="920" dy="24.15">and power</tspan></text><text x="920" y="1082" font-size="19" text-anchor="middle"><tspan x="920" dy="0">SciPy / statsmodels</tspan></text><path d="M665 1045 L905 1045" class="wire" /><path d="M1160 1032 L1173 1045 L1160 1058 L1147 1045Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="979" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Networks /</tspan><tspan x="1160" dy="24.15">genome links</tspan></text><text x="1160" y="1082" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">SPIEC-EASI / BLAST+</tspan></text><path d="M935 1045 L1145 1045" class="wire" /><path d="M1175 1045 L1356.5 1045" class="wire" /><path d="M290 1059.5 L290 1205.5" class="wire" /><text x="140" y="1212" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Results</tspan><tspan x="140" dy="31.049999999999997">&amp; provenance</tspan></text><rect x="277" y="1207" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="1227" font-size="20" text-anchor="middle"><tspan x="290" dy="0">6</tspan></text><circle cx="430" cy="1220" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="1154" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Module outputs</tspan><tspan x="430" dy="24.15">and QC audits</tspan></text><circle cx="1370" cy="1220" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="1154" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Auditable</tspan><tspan x="1370" dy="24.15">run outputs</tspan></text><path d="M304.5 1220 L416.5 1220" class="wire" /><path d="M650 1207 L663 1220 L650 1233 L637 1220Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="1154" font-size="21" text-anchor="middle"><tspan x="650" dy="0">All-library</tspan><tspan x="650" dy="24.15">Sankey</tspan></text><text x="650" y="1257" font-size="19" text-anchor="middle"><tspan x="650" dy="0">ASPIRE</tspan></text><path d="M443.5 1220 L635 1220" class="wire" /><path d="M920 1207 L933 1220 L920 1233 L907 1220Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="1154" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Integrated</tspan><tspan x="920" dy="24.15">HTML report</tspan></text><text x="920" y="1257" font-size="19" text-anchor="middle"><tspan x="920" dy="0">ASPIRE</tspan></text><path d="M665 1220 L905 1220" class="wire" /><path d="M1160 1207 L1173 1220 L1160 1233 L1147 1220Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="1154" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Logs and</tspan><tspan x="1160" dy="24.15">checksums</tspan></text><text x="1160" y="1257" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">Nextflow / ASPIRE</tspan></text><path d="M935 1220 L1145 1220" class="wire" /><path d="M1175 1220 L1356.5 1220" class="wire" /><text x="750" y="1365" font-size="19" text-anchor="middle"><tspan x="750" dy="0">Numbered modules group related operations; arrows summarize flow and enabled branches follow their dependencies.</tspan></text></svg></svg>
