<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="2860" viewBox="0 100 2300 2860" role="img" aria-labelledby="title desc" data-workflow-style="aspire-approved-branched"><title id="title">ASPIRE detailed workflow</title><desc id="desc">Shared read processing, taxonomy, contamination removal, filtering and metadata preparation split into ASV and optional ASV–VOC analyses. Genome linkage consumes filtered sequences independently of network inference. Results converge on summary reporting. Analysis spines group operations rather than impose a serial execution schedule.</desc><rect x="0" y="100" width="2300" height="2860" fill="#FFFFFF" /><style>text{font-family:"Trebuchet MS",sans-serif;fill:#111111}.wire{fill:none;stroke:#111111;stroke-width:1.5;marker-end:url(#arrow)}.guide{fill:none;stroke:#888;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#111111" /></marker></defs><circle cx="980" cy="160" r="13" fill="#DAE8F6" stroke="#6D8EBF" stroke-width="3" /><text x="840" y="143" font-size="23" text-anchor="middle"><tspan x="840" dy="0">Sequencing data</tspan><tspan x="840" dy="27.599999999999998">Paired FASTQs</tspan></text><circle cx="1320" cy="160" r="13" fill="#DAE8F6" stroke="#6D8EBF" stroke-width="3" /><text x="1510" y="143" font-size="23" text-anchor="middle"><tspan x="1510" dy="0">Auxiliary data</tspan><tspan x="1510" dy="27.599999999999998">Metadata and sample manifest</tspan></text><path d="M994 160 H1306" fill="none" stroke="#111111" stroke-width="1.5" /><path d="M1150 160 V286" class="wire" /><circle cx="1450" cy="460" r="13" fill="#DAE8F6" stroke="#6D8EBF" stroke-width="3" /><text x="1505" y="467" font-size="23" text-anchor="start"><tspan x="1505" dy="0">Input</tspan></text><path d="M1450 546 L1464 560 L1450 574 L1436 560Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="1505" y="567" font-size="23" text-anchor="start"><tspan x="1505" dy="0">Process</tspan></text><circle cx="1450" cy="660" r="13" fill="#D5E7D4" stroke="#81B366" stroke-width="3" /><text x="1505" y="667" font-size="23" text-anchor="start"><tspan x="1505" dy="0">Output</tspan></text><path d="M1150 286 L1164 300 L1150 314 L1136 300Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="760" y="280" font-size="26" text-anchor="middle"><tspan x="760" dy="0">Read QC</tspan></text><text x="760" y="318" font-size="20" text-anchor="middle"><tspan x="760" dy="0">Cutadapt / fastp / VSEARCH / SeqKit</tspan></text><text x="760" y="350" font-size="19" text-anchor="middle"><tspan x="760" dy="0">Optional paired-primer removal and amplicon-family audit</tspan><tspan x="760" dy="22.8">Read QC, paired-read merging, filtering and relabelling</tspan></text><path d="M1105 300 H1127" class="guide" /><path d="M1150 314 V446" class="wire" /><path d="M1150 446 L1164 460 L1150 474 L1136 460Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="760" y="440" font-size="26" text-anchor="middle"><tspan x="760" dy="0">Denoise and remove chimeras</tspan></text><text x="760" y="478" font-size="20" text-anchor="middle"><tspan x="760" dy="0">VSEARCH: dereplication / UNOISE / UCHIME</tspan></text><text x="760" y="510" font-size="19" text-anchor="middle"><tspan x="760" dy="0">Dereplicate and denoise reads; remove chimeras</tspan><tspan x="760" dy="22.8">Construct ASV sequences and the sample-by-ASV count matrix</tspan></text><path d="M1105 460 H1127" class="guide" /><path d="M1150 474 V606" class="wire" /><path d="M1150 606 L1164 620 L1150 634 L1136 620Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="760" y="600" font-size="26" text-anchor="middle"><tspan x="760" dy="0">Alignment and taxonomic labelling</tspan></text><text x="760" y="638" font-size="20" text-anchor="middle"><tspan x="760" dy="0">SINA / QIIME 2 / SILVA</tspan></text><text x="760" y="670" font-size="19" text-anchor="middle"><tspan x="760" dy="0">Align inferred sequences and assign full ASV taxonomy</tspan><tspan x="760" dy="22.8">Retain taxonomy confidence and reference provenance</tspan></text><path d="M1105 620 H1127" class="guide" /><path d="M1150 634 V766" class="wire" /><path d="M1150 766 L1164 780 L1150 794 L1136 780Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="760" y="760" font-size="26" text-anchor="middle"><tspan x="760" dy="0">Contamination and host removal</tspan></text><text x="760" y="798" font-size="20" text-anchor="middle"><tspan x="760" dy="0">decontam / MITOMASTER / BLAST+ / SeqKit</tspan></text><text x="760" y="830" font-size="19" text-anchor="middle"><tspan x="760" dy="0">Biological depth QC; TECH / BIO prevalence tests when enabled</tspan><tspan x="760" dy="22.8">Combine flagged ASVs; screen mitochondrial and contaminant references</tspan></text><path d="M1105 780 H1127" class="guide" /><path d="M1150 794 V926" class="wire" /><path d="M1150 926 L1164 940 L1150 954 L1136 940Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="760" y="890" font-size="26" text-anchor="middle"><tspan x="760" dy="0">Abundance / prevalence filtering</tspan><tspan x="760" dy="31.2">and ambiguous taxon removal</tspan></text><text x="760" y="958" font-size="20" text-anchor="middle"><tspan x="760" dy="0">Combined count-table and FASTA filtering</tspan></text><text x="760" y="990" font-size="19" text-anchor="middle"><tspan x="760" dy="0">Apply configured abundance, prevalence and taxonomy rules</tspan><tspan x="760" dy="22.8">Remove zero-count features; synchronize final counts and FASTA; audit exclusions</tspan></text><path d="M1105 940 H1127" class="guide" /><path d="M1150 954 V1086" class="wire" /><path d="M1150 1086 L1164 1100 L1150 1114 L1136 1100Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="760" y="1080" font-size="26" text-anchor="middle"><tspan x="760" dy="0">Batch correction with metadata</tspan></text><text x="760" y="1118" font-size="20" text-anchor="middle"><tspan x="760" dy="0">ConQuR (optional) / metadata preparation</tspan></text><text x="760" y="1150" font-size="19" text-anchor="middle"><tspan x="760" dy="0">Join sample metadata; construct long / wide tables and CLR representations</tspan><tspan x="760" dy="22.8">Cohort diagnostics and selection; synchronize corrected and raw analytical inputs</tspan></text><path d="M1105 1100 H1127" class="guide" /><path d="M1150 1114 V1236" class="wire" /><circle cx="1150" cy="1250" r="13" fill="#D5E7D4" stroke="#81B366" stroke-width="3" /><text x="1500" y="1240" font-size="24" text-anchor="middle"><tspan x="1500" dy="0">Filtered and corrected ASVs / count data</tspan></text><path d="M1136 1250 H1100 V2416" class="wire" /><path d="M1150 1264 V1320 H650 V1416" class="wire" /><path d="M1150 1320 H1660 V1416" class="wire" /><text x="600" y="1360" font-size="28" text-anchor="end"><tspan x="600" dy="0">ASV analysis</tspan></text><text x="1710" y="1360" font-size="28" text-anchor="start"><tspan x="1710" dy="0">ASV–VOC analysis</tspan></text><circle cx="2070" cy="1320" r="13" fill="#DAE8F6" stroke="#6D8EBF" stroke-width="3" /><text x="2070" y="1250" font-size="22" text-anchor="middle"><tspan x="2070" dy="0">Processed VOC data</tspan><tspan x="2070" dy="26.4">(optional)</tspan></text><path d="M2056 1320 H1674" class="wire" /><path d="M650 1416 L664 1430 L650 1444 L636 1430Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="315" y="1410" font-size="25" text-anchor="middle"><tspan x="315" dy="0">Diversity estimation</tspan></text><text x="315" y="1448" font-size="20" text-anchor="middle"><tspan x="315" dy="0">Shannon / Bray–Curtis / Jaccard / PERMANOVA</tspan></text><text x="315" y="1483" font-size="19" text-anchor="middle"><tspan x="315" dy="0">scikit-bio / vegan; ordination and collectors curves</tspan><tspan x="315" dy="22.8">Full biological cohort retained; matched subsets where configured</tspan></text><path d="M600 1430 H627" class="guide" /><path d="M650 1444 V1636" class="wire" /><path d="M650 1636 L664 1650 L650 1664 L636 1650Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="315" y="1630" font-size="25" text-anchor="middle"><tspan x="315" dy="0">Clustering and outlier detection</tspan></text><text x="315" y="1668" font-size="20" text-anchor="middle"><tspan x="315" dy="0">UMAP / CLR / HDBSCAN</tspan></text><text x="315" y="1703" font-size="19" text-anchor="middle"><tspan x="315" dy="0">Embedding, group diagnostics and outlier summaries</tspan><tspan x="315" dy="22.8">Selected cohort feeds subsequent study-specific analyses</tspan></text><path d="M600 1650 H627" class="guide" /><path d="M650 1664 V1856" class="wire" /><path d="M650 1856 L664 1870 L650 1884 L636 1870Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="315" y="1850" font-size="25" text-anchor="middle"><tspan x="315" dy="0">Indicator species analysis</tspan></text><text x="315" y="1888" font-size="20" text-anchor="middle"><tspan x="315" dy="0">indicspecies; permutation tests / FDR</tspan></text><text x="315" y="1923" font-size="19" text-anchor="middle"><tspan x="315" dy="0">Group and multigroup indicators; taxonomy-linked plots</tspan><tspan x="315" dy="22.8">Indicator membership supplies ASV–VOC overlays</tspan></text><path d="M600 1870 H627" class="guide" /><path d="M650 1884 V2076" class="wire" /><path d="M650 2076 L664 2090 L650 2104 L636 2090Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="315" y="2070" font-size="25" text-anchor="middle"><tspan x="315" dy="0">Taxon clustering and mapping</tspan></text><text x="315" y="2108" font-size="20" text-anchor="middle"><tspan x="315" dy="0">Hierarchical clustering / heatmaps / vegan</tspan></text><text x="315" y="2143" font-size="19" text-anchor="middle"><tspan x="315" dy="0">ASV clustermaps, taxonomy / group tests and paired contrasts</tspan><tspan x="315" dy="22.8">Patient-count power simulations and study-design summaries</tspan></text><path d="M600 2090 H627" class="guide" /><path d="M650 2104 V2296" class="wire" /><path d="M650 2296 L664 2310 L650 2324 L636 2310Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="315" y="2290" font-size="25" text-anchor="middle"><tspan x="315" dy="0">Correlation network analysis</tspan></text><text x="315" y="2328" font-size="20" text-anchor="middle"><tspan x="315" dy="0">SPIEC-EASI / igraph: Leiden / NetworkX</tspan></text><text x="315" y="2363" font-size="19" text-anchor="middle"><tspan x="315" dy="0">Filtered network inference, consensus modules and null topology</tspan><tspan x="315" dy="22.8">Graph exports; optional genome-linked network overlays</tspan></text><path d="M600 2310 H627" class="guide" /><path d="M1660 1416 L1674 1430 L1660 1444 L1646 1430Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="1980" y="1410" font-size="25" text-anchor="middle"><tspan x="1980" dy="0">Correlation analysis</tspan></text><text x="1980" y="1448" font-size="20" text-anchor="middle"><tspan x="1980" dy="0">Spearman / p-values / BH-FDR</tspan></text><text x="1980" y="1483" font-size="19" text-anchor="middle"><tspan x="1980" dy="0">Match ASVs, processed VOCs and sample metadata</tspan><tspan x="1980" dy="22.8">Sample-type subsets and sample-level association tables</tspan></text><path d="M1710 1430 H1683" class="guide" /><path d="M1660 1444 V1636" class="wire" /><path d="M1660 1636 L1674 1650 L1660 1664 L1646 1650Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="1980" y="1630" font-size="25" text-anchor="middle"><tspan x="1980" dy="0">Clustering and mapping</tspan></text><text x="1980" y="1668" font-size="20" text-anchor="middle"><tspan x="1980" dy="0">Hierarchical clustering / heatmaps</tspan></text><text x="1980" y="1703" font-size="19" text-anchor="middle"><tspan x="1980" dy="0">VOC–ASV and VOC-profile clustermaps</tspan><tspan x="1980" dy="22.8">Indicator overlays and focused ISA–VOC comparisons</tspan></text><path d="M1710 1650 H1683" class="guide" /><path d="M1660 1664 V1856" class="wire" /><path d="M1660 1856 L1674 1870 L1660 1884 L1646 1870Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="1980" y="1850" font-size="25" text-anchor="middle"><tspan x="1980" dy="0">Sample–VOC analysis</tspan></text><text x="1980" y="1888" font-size="20" text-anchor="middle"><tspan x="1980" dy="0">Z-score summaries</tspan></text><text x="1980" y="1923" font-size="19" text-anchor="middle"><tspan x="1980" dy="0">Sample-level VOC patterns and annotated heatmaps</tspan><tspan x="1980" dy="22.8">Case summaries display mean and standard deviation</tspan></text><path d="M1710 1870 H1683" class="guide" /><path d="M1660 1884 V2076" class="wire" /><path d="M1660 2076 L1674 2090 L1660 2104 L1646 2090Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="1980" y="2070" font-size="25" text-anchor="middle"><tspan x="1980" dy="0">Participant–VOC analysis</tspan></text><text x="1980" y="2108" font-size="20" text-anchor="middle"><tspan x="1980" dy="0">Mann–Whitney / permutations / BH-FDR</tspan></text><text x="1980" y="2143" font-size="19" text-anchor="middle"><tspan x="1980" dy="0">Aggregate within participants; RA / CLR concordance</tspan><tspan x="1980" dy="22.8">Patient-level inference and cancer / control comparisons</tspan></text><path d="M1710 2090 H1683" class="guide" /><path d="M664 1870 H1090" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 5" /><path d="M1110 1870 H1510 V1650 H1646" class="wire" stroke-dasharray="5 5" /><text x="1400" y="1845" font-size="19" text-anchor="middle"><tspan x="1400" dy="0">ISA overlays</tspan></text><circle cx="1370" cy="2320" r="13" fill="#DAE8F6" stroke="#6D8EBF" stroke-width="3" /><text x="1370" y="2255" font-size="22" text-anchor="middle"><tspan x="1370" dy="0">Genome references</tspan><tspan x="1370" dy="26.4">(optional)</tspan></text><path d="M1370 2334 V2370 H1100" fill="none" stroke="#111111" stroke-width="1.5" /><path d="M1100 2416 L1114 2430 L1100 2444 L1086 2430Z" fill="#FFFFFF" stroke="#010101" stroke-width="1" /><text x="1375" y="2410" font-size="25" text-anchor="middle"><tspan x="1375" dy="0">Genome linkage</tspan></text><text x="1375" y="2450" font-size="19" text-anchor="middle"><tspan x="1375" dy="0">BLAST+ / genome-derived 16S references</tspan></text><text x="1375" y="2480" font-size="18" text-anchor="middle"><tspan x="1375" dy="0">Identity / query-coverage and taxonomy gates</tspan><tspan x="1375" dy="21.599999999999998">Unique / ambiguous matches; genome QC metadata</tspan></text><path d="M1100 2444 V2616" class="wire" /><circle cx="1100" cy="2630" r="13" fill="#D5E7D4" stroke="#81B366" stroke-width="3" /><text x="1375" y="2620" font-size="20" text-anchor="middle"><tspan x="1375" dy="0">Genome-linkage tables</tspan><tspan x="1375" dy="24.0">Network overlays / module anchors</tspan></text><path d="M650 2324 V2760 H1150" fill="none" stroke="#111111" stroke-width="1.5" /><path d="M1100 2644 V2760" fill="none" stroke="#111111" stroke-width="1.5" /><path d="M1660 2104 V2760 H1150" fill="none" stroke="#111111" stroke-width="1.5" /><path d="M1150 2760 V2836" class="wire" /><circle cx="1150" cy="2850" r="13" fill="#D5E7D4" stroke="#81B366" stroke-width="3" /><text x="1150" y="2900" font-size="28" text-anchor="middle"><tspan x="1150" dy="0">Summary reporting</tspan></text><text x="1150" y="2940" font-size="22" text-anchor="middle"><tspan x="1150" dy="0">(figures and tables)</tspan></text></svg>