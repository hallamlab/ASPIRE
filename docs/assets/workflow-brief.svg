<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="title desc"><title id="title">ASPIRE workflow overview</title><desc id="desc">Amplicon reads become ASVs and taxonomy, then microbial tables after configured non-target and optional control-based decontamination. Enabled ecology, association, network and genome-link analyses produce tables, figures and an integrated run report. Conceptual modules, not a serial execution schedule.</desc><rect width="1000" height="1300" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker></defs><style>text{font-family:"Times New Roman",Times,serif;fill:#111111}.wire{fill:none;stroke:#111111;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect x="20" y="20" width="960" height="80" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5"/>
<text x="500" y="54" font-size="29" text-anchor="middle"><tspan x="500" dy="0">ASPIRE • Amplicon analysis with Nextflow</tspan></text>
<text x="500" y="84" font-size="21" text-anchor="middle"><tspan x="500" dy="0">Reads + references + study metadata; optional controls and genome inputs</tspan></text>
<text x="125" y="198" font-size="25" text-anchor="middle"><tspan x="125" dy="0">Sequence</tspan><tspan x="125" dy="28.249999999999996">processing</tspan></text>
<rect x="230" y="197" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="243" y="217" font-size="20" text-anchor="middle"><tspan x="243" dy="0">1</tspan></text>
<circle cx="350" cy="210" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="350" y="146" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Amplicon</tspan><tspan x="350" dy="23.729999999999997">reads</tspan></text>
<path d="M 257.5 210 L 336.5 210" class="wire"/><path d="M 363.5 210 L 564.879 210" class="wire"/>
<path d="M 580 197 L 593 210 L 580 223 L 567 210 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="146" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Read QC, ASV inference</tspan><tspan x="580" dy="25.99">and taxonomic assignment</tspan></text>
<path d="M 595.121 210 L 866.5 210" class="wire"/>
<circle cx="880" cy="210" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="146" font-size="23" text-anchor="middle"><tspan x="880" dy="0">ASVs, counts</tspan><tspan x="880" dy="25.99">and taxonomy</tspan></text>
<text x="580" y="252" font-size="18" text-anchor="middle"><tspan x="580" dy="0">fastp • VSEARCH • SINA / QIIME 2</tspan></text>
<text x="125" y="403" font-size="25" text-anchor="middle"><tspan x="125" dy="0">Filtering and</tspan><tspan x="125" dy="28.249999999999996">table preparation</tspan></text>
<rect x="230" y="402" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="243" y="422" font-size="20" text-anchor="middle"><tspan x="243" dy="0">2</tspan></text>
<circle cx="350" cy="415" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="350" y="351" font-size="21" text-anchor="middle"><tspan x="350" dy="0">ASVs, controls</tspan><tspan x="350" dy="23.729999999999997">and metadata</tspan></text>
<path d="M 257.5 415 L 336.5 415" class="wire"/><path d="M 363.5 415 L 564.879 415" class="wire"/>
<path d="M 580 402 L 593 415 L 580 428 L 567 415 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="351" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Non-target removal;</tspan><tspan x="580" dy="25.99">control-based decontam</tspan></text>
<path d="M 595.121 415 L 866.5 415" class="wire"/>
<circle cx="880" cy="415" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="351" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Selected microbial</tspan><tspan x="880" dy="25.99">analysis tables</tspan></text>
<text x="580" y="457" font-size="18" text-anchor="middle"><tspan x="580" dy="0">Optional pooled prevalence, within-type frequency and plausibility tiers</tspan></text>
<text x="125" y="608" font-size="25" text-anchor="middle"><tspan x="125" dy="0">Community</tspan><tspan x="125" dy="28.249999999999996">ecology</tspan></text>
<rect x="230" y="607" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="243" y="627" font-size="20" text-anchor="middle"><tspan x="243" dy="0">3</tspan></text>
<circle cx="350" cy="620" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="350" y="556" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Selected counts</tspan><tspan x="350" dy="23.729999999999997">and metadata</tspan></text>
<path d="M 257.5 620 L 336.5 620" class="wire"/><path d="M 363.5 620 L 564.879 620" class="wire"/>
<path d="M 580 607 L 593 620 L 580 633 L 567 620 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="556" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Alpha: Shannon</tspan><tspan x="580" dy="25.99">Beta: Bray–Curtis / Jaccard</tspan></text>
<path d="M 595.121 620 L 866.5 620" class="wire"/>
<circle cx="880" cy="620" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="556" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Diversity, structure</tspan><tspan x="880" dy="25.99">and group tests</tspan></text>
<text x="580" y="662" font-size="18" text-anchor="middle"><tspan x="580" dy="0">Collector curves • PERMANOVA / PERMDISP • PCoA / UMAP¹</tspan></text>
<text x="125" y="813" font-size="25" text-anchor="middle"><tspan x="125" dy="0">Indicators and</tspan><tspan x="125" dy="28.249999999999996">associations</tspan></text>
<rect x="230" y="812" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="243" y="832" font-size="20" text-anchor="middle"><tspan x="243" dy="0">4</tspan></text>
<circle cx="350" cy="825" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="350" y="761" font-size="21" text-anchor="middle"><tspan x="350" dy="0">ASV tables;</tspan><tspan x="350" dy="23.729999999999997">study measurements</tspan></text>
<path d="M 257.5 825 L 336.5 825" class="wire"/><path d="M 363.5 825 L 564.879 825" class="wire"/>
<path d="M 580 812 L 593 825 L 580 838 L 567 825 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="761" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Indicator species;</tspan><tspan x="580" dy="25.99">VOC / measurement tests</tspan></text>
<path d="M 595.121 825 L 866.5 825" class="wire"/>
<circle cx="880" cy="825" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="761" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Associations and</tspan><tspan x="880" dy="25.99">study contrasts</tspan></text>
<text x="580" y="867" font-size="18" text-anchor="middle"><tspan x="580" dy="0">Patient-aware inference • Taxonomic / paired comparisons • Power</tspan></text>
<text x="125" y="1018" font-size="25" text-anchor="middle"><tspan x="125" dy="0">Networks and</tspan><tspan x="125" dy="28.249999999999996">genome links</tspan></text>
<rect x="230" y="1017" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="243" y="1037" font-size="20" text-anchor="middle"><tspan x="243" dy="0">5</tspan></text>
<circle cx="350" cy="1030" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="350" y="966" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Counts; optional</tspan><tspan x="350" dy="23.729999999999997">genome references</tspan></text>
<path d="M 257.5 1030 L 336.5 1030" class="wire"/><path d="M 363.5 1030 L 564.879 1030" class="wire"/>
<path d="M 580 1017 L 593 1030 L 580 1043 L 567 1030 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="966" font-size="23" text-anchor="middle"><tspan x="580" dy="0">SPIEC-EASI networks;</tspan><tspan x="580" dy="25.99">modules and topology</tspan></text>
<path d="M 595.121 1030 L 866.5 1030" class="wire"/>
<circle cx="880" cy="1030" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="966" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Graphs, modules</tspan><tspan x="880" dy="25.99">and ASV–MAG links</tspan></text>
<text x="580" y="1072" font-size="18" text-anchor="middle"><tspan x="580" dy="0">Optional ASV–16S genome mapping and module anchors</tspan></text>
<text x="125" y="1223" font-size="25" text-anchor="middle"><tspan x="125" dy="0">Reporting</tspan></text>
<rect x="230" y="1222" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="243" y="1242" font-size="20" text-anchor="middle"><tspan x="243" dy="0">6</tspan></text>
<circle cx="350" cy="1235" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="350" y="1171" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Enabled outputs</tspan><tspan x="350" dy="23.729999999999997">and execution logs</tspan></text>
<path d="M 257.5 1235 L 336.5 1235" class="wire"/><path d="M 363.5 1235 L 564.879 1235" class="wire"/>
<path d="M 580 1222 L 593 1235 L 580 1248 L 567 1235 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="1171" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Integrate tables, figures</tspan><tspan x="580" dy="25.99">and provenance</tspan></text>
<path d="M 595.121 1235 L 866.5 1235" class="wire"/>
<circle cx="880" cy="1235" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="1171" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Run report and</tspan><tspan x="880" dy="25.99">organized results</tspan></text>
<text x="580" y="1277" font-size="18" text-anchor="middle"><tspan x="580" dy="0">¹ Analytical branches and patient-aware methods run as configured</tspan></text>
</svg>
