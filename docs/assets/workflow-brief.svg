0" dy="0">SeqKit</tspan></text><path d="M443.5 1620 L635 1620" class="wire" /><path d="M920 1607 L933 1620 L920 1633 L907 1620Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="1554" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Sankey / report</tspan></text><path d="M665 1620 L905 1620" class="wire" /><path d="M1160 1607 L1173 1620 L1160 1633 L1147 1620Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="1554" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Logs / checksums</tspan></text><text x="1160" y="1657" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">Nextflow</tspan></text><path d="M935 1620 L1145 1620" class="wire" /><path d="M1175 1620 L1356.5 1620" class="wire" /><text x="750" y="1765" font-size="19" text-anchor="middle"><tspan x="750" dy="0">Optional steps follow configuration. CLR: centered log-ratio • ISA: indicator species analysis.</tspan></text></svg>