<text x="350" y="506" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Selected tables;</tspan><tspan x="350" dy="23.729999999999997">other inputs as needed</tspan></text>
<path d="M 257.5 570 L 336.5 570" class="wire"/><path d="M 363.5 570 L 564.879 570" class="wire"/>
<path d="M 580 557 L 593 570 L 580 583 L 567 570 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="506" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Ecology, associations,</tspan><tspan x="580" dy="25.99">networks and genome links</tspan></text>
<path d="M 595.121 570 L 866.5 570" class="wire"/>
<circle cx="880" cy="570" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="506" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Analytical</tspan><tspan x="880" dy="25.99">tables and figures</tspan></text>
<text x="580" y="612" font-size="20" text-anchor="middle"><tspan x="580" dy="0">Branches selected by configuration</tspan></text>
<text x="125" y="733" font-size="25" text-anchor="middle"><tspan x="125" dy="0">Reporting</tspan></text>
<rect x="230" y="732" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="243" y="752" font-size="20" text-anchor="middle"><tspan x="243" dy="0">4</tspan></text>
<circle cx="350" cy="745" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="350" y="681" font-size="21" text-anchor="middle"><tspan x="350" dy="0">Enabled results</tspan><tspan x="350" dy="23.729999999999997">and run logs</tspan></text>
<path d="M 257.5 745 L 336.5 745" class="wire"/><path d="M 363.5 745 L 564.879 745" class="wire"/>
<path d="M 580 732 L 593 745 L 580 758 L 567 745 Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="580" y="681" font-size="23" text-anchor="middle"><tspan x="580" dy="0">Combine outputs</tspan><tspan x="580" dy="25.99">and provenance</tspan></text>
<path d="M 595.121 745 L 866.5 745" class="wire"/>
<circle cx="880" cy="745" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="880" y="681" font-size="23" text-anchor="middle"><tspan x="880" dy="0">Run report and</tspan><tspan x="880" dy="25.99">organized results</tspan></text>
