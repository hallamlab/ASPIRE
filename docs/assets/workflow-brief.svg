<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1785" viewBox="0 0 1500 1785" role="img" aria-labelledby="title desc" data-workflow-style="mp-nodal-v1"><title id="title">ASPIRE: amplicon analysis workflow</title><desc id="desc">Numbered conceptual modules use the MetaPathways nodal style. Shared read processing and full taxonomy precede control decontamination and final feature filtering. Diversity keeps the full biological cohort; selected groups feed other analyses. Module numbers are not a serial execution schedule.</desc><rect width="1500" height="1785" fill="#FFFFFF" /><style>text{font-family:"Times New Roman",Times,serif;fill:#111111}.wire{fill:none;stroke:#111111;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#111111" /></marker></defs><rect x="20" y="20" width="1460" height="80" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5" /><text x="750" y="54" font-size="29" text-anchor="middle"><tspan x="750" dy="0">ASPIRE • Amplicon analysis with Nextflow</tspan></text><text x="750" y="83" font-size="21" text-anchor="middle"><tspan x="750" dy="0">Reads → filtered ASVs → prepared tables → analyses → reports</tspan></text><rect x="20" y="120" width="770" height="130" rx="16" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" /><text x="42" y="152" font-size="25" text-anchor="start"><tspan x="42" dy="0">Inputs</tspan></text><text x="42" y="181" font-size="21" text-anchor="start"><tspan x="42" dy="0">FASTQs • Manifest • Metadata • References</tspan><tspan x="42" dy="24.15">Optional: controls • VOCs • Genomes</tspan></text><rect x="820" y="120" width="660" height="100" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5" /><text x="880" y="150" font-size="21" text-anchor="middle"><tspan x="880" dy="0">Module</tspan></text><rect x="867" y="170" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="1010" y="150" font-size="21" text-anchor="middle"><tspan x="1010" dy="0">Compute</tspan></text><path d="M1010 170 L1023 183 L1010 196 L997 183Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1140" y="150" font-size="21" text-anchor="middle"><tspan x="1140" dy="0">Data</tspan></text><circle cx="1140" cy="183" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="data" /><text x="1270" y="150" font-size="21" text-anchor="middle"><tspan x="1270" dy="0">Input</tspan></text><circle cx="1270" cy="183" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="1400" y="150" font-size="21" text-anchor="middle"><tspan x="1400" dy="0">Output</tspan></text><circle cx="1400" cy="183" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="140" y="337" font-size="27" text-anchor="middle"><tspan x="140" dy="0">FASTQ → ASVs</tspan></text><rect x="277" y="332" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="352" font-size="20" text-anchor="middle"><tspan x="290" dy="0">1</tspan></text><circle cx="430" cy="345" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="279" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Paired FASTQs</tspan></text><circle cx="1370" cy="345" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="279" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Initial ASVs</tspan><tspan x="1370" dy="24.15">+ counts</tspan></text><path d="M304.5 345 L416.5 345" class="wire" /><path d="M650 332 L663 345 L650 358 L637 345Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="279" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Primer removal /</tspan><tspan x="650" dy="24.15">read QC</tspan></text><text x="650" y="382" font-size="19" text-anchor="middle"><tspan x="650" dy="0">Cutadapt / fastp</tspan></text><path d="M443.5 345 L635 345" class="wire" /><path d="M920 332 L933 345 L920 358 L907 345Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="279" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Merge / filter</tspan></text><text x="920" y="382" font-size="19" text-anchor="middle"><tspan x="920" dy="0">VSEARCH</tspan></text><path d="M665 345 L905 345" class="wire" /><path d="M1160 332 L1173 345 L1160 358 L1147 345Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="279" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Denoise / remove</tspan><tspan x="1160" dy="24.15">chimeras / count</tspan></text><text x="1160" y="382" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">VSEARCH</tspan></text><path d="M935 345 L1145 345" class="wire" /><path d="M1175 345 L1356.5 345" class="wire" /><path d="M290 359.5 L290 505.5" class="wire" /><text x="140" y="512" font-size="27" text-anchor="middle"><tspan x="140" dy="0">ASV filtering</tspan></text><rect x="277" y="507" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="527" font-size="20" text-anchor="middle"><tspan x="290" dy="0">2</tspan></text><circle cx="430" cy="520" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="454" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Initial ASVs</tspan><tspan x="430" dy="24.15">+ counts</tspan></text><circle cx="1370" cy="520" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="454" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Filtered ASVs</tspan><tspan x="1370" dy="24.15">+ counts</tspan></text><path d="M304.5 520 L416.5 520" class="wire" /><path d="M650 507 L663 520 L650 533 L637 520Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="454" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Taxonomy</tspan></text><text x="650" y="557" font-size="19" text-anchor="middle"><tspan x="650" dy="0">SINA / QIIME 2</tspan></text><path d="M443.5 520 L635 520" class="wire" /><path d="M920 507 L933 520 L920 533 L907 520Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="454" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Depth QC /</tspan><tspan x="920" dy="24.15">control decontamination</tspan></text><text x="920" y="557" font-size="19" text-anchor="middle"><tspan x="920" dy="0">decontam (TECH / BIO)</tspan></text><path d="M665 520 L905 520" class="wire" /><path d="M1160 507 L1173 520 L1160 533 L1147 520Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="454" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Non-target removal /</tspan><tspan x="1160" dy="24.15">abundance / prevalence</tspan></text><text x="1160" y="557" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">MITOMASTER / BLAST+</tspan></text><path d="M935 520 L1145 520" class="wire" /><path d="M1175 520 L1356.5 520" class="wire" /><path d="M290 534.5 L290 680.5" class="wire" /><text x="140" y="687" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Metadata &amp;</tspan><tspan x="140" dy="31.049999999999997">transformations</tspan></text><rect x="277" y="682" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="702" font-size="20" text-anchor="middle"><tspan x="290" dy="0">3</tspan></text><circle cx="430" cy="695" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="629" font-size="21" text-anchor="middle"><tspan x="430" dy="0">ASVs + metadata</tspan></text><circle cx="1370" cy="695" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="629" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Counts / CLR</tspan><tspan x="1370" dy="24.15">+ metadata</tspan></text><path d="M304.5 695 L416.5 695" class="wire" /><path d="M650 682 L663 695 L650 708 L637 695Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="650" y="629" font-size="21" text-anchor="middle"><tspan x="650" dy="0">Link sample</tspan><tspan x="650" dy="24.15">metadata</tspan></text><path d="M443.5 695 L635 695" class="wire" /><path d="M920 682 L933 695 L920 708 L907 695Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="629" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Transform counts /</tspan><tspan x="920" dy="24.15">batch correction</tspan></text><text x="920" y="732" font-size="19" text-anchor="middle"><tspan x="920" dy="0">ConQuR</tspan><tspan x="920" dy="21.849999999999998">UMAP / HDBSCAN</tspan></text><path d="M665 695 L905 695" class="wire" /><path d="M1160 682 L1173 695 L1160 708 L1147 695Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="1160" y="629" font-size="21" text-anchor="middle"><tspan x="1160" dy="0">Group diagnostics /</tspan><tspan x="1160" dy="24.15">cohort selection</tspan></text><text x="1160" y="732" font-size="19" text-anchor="middle"><tspan x="1160" dy="0">scikit-learn</tspan></text><path d="M935 695 L1145 695" class="wire" /><path d="M1175 695 L1356.5 695" class="wire" /><path d="M290 709.5 L290 975.5" class="wire" /><text x="140" y="982" font-size="27" text-anchor="middle"><tspan x="140" dy="0">Community</tspan><tspan x="140" dy="31.049999999999997">analysis</tspan></text><rect x="277" y="977" width="26" height="26" fill="#F5F5F5" stroke="#111111" stroke-width="3" data-node="module" /><text x="290" y="997" font-size="20" text-anchor="middle"><tspan x="290" dy="0">4</tspan></text><circle cx="430" cy="990" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3" data-node="input" /><text x="430" y="924" font-size="21" text-anchor="middle"><tspan x="430" dy="0">Prepared tables</tspan></text><circle cx="1370" cy="990" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3" data-node="output" /><text x="1370" y="924" font-size="21" text-anchor="middle"><tspan x="1370" dy="0">Community</tspan><tspan x="1370" dy="24.15">results</tspan></text><path d="M304.5 990 L416.5 990" class="wire" /><path d="M920 857 L933 870 L920 883 L907 870Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="835" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Diversity / ordination</tspan></text><text x="920" y="907" font-size="19" text-anchor="middle"><tspan x="920" dy="0">scikit-bio / vegan</tspan></text><text x="665" y="858" font-size="19" text-anchor="middle"><tspan x="665" dy="0">Full biological cohort</tspan></text><path d="M443.5 990 H535 V870 H905" class="wire" /><path d="M935 870 H1260 V990 H1356.5" class="wire" /><path d="M920 977 L933 990 L920 1003 L907 990Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="932" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Indicators / ASV clustermaps</tspan><tspan x="920" dy="24.15">contrasts / power</tspan></text><text x="920" y="1027" font-size="19" text-anchor="middle"><tspan x="920" dy="0">indicspecies / vegan</tspan></text><text x="665" y="978" font-size="19" text-anchor="middle"><tspan x="665" dy="0">Selected cohort</tspan></text><path d="M443.5 990 H535 V990 H905" class="wire" /><path d="M935 990 H1260 V990 H1356.5" class="wire" /><path d="M920 1097 L933 1110 L920 1123 L907 1110Z" fill="#F5F5F5" stroke="#666666" stroke-width="3" data-node="compute" /><text x="920" y="1075" font-size="21" text-anchor="middle"><tspan x="920" dy="0">Networks / genome links</tspan></text><text x="920" y="1147" font-size="19" text-anchor="middle"><tspan x="920" dy="0">SPIEC-EASI / BLAST+</tspan><tspan x="920" dy="21.849999999999998">igraph / NetworkX</tspan></text><tex