paths:
  input_dir: /abs/path/input_fastqs
  output_dir: /abs/path/output_dir
  # Optional. Discovery writes output_dir/metadata/run_manifest.tsv.
  manifest: /abs/path/sample_manifest.tsv
  # Optional; defaults to the hidden persistent <output_dir>/.aspire directory.
  runtime_dir: /abs/path/output_dir/.aspire
  # Keep true for -resume/--rerun-from. Set false only to discard all task caches.
  keep_runtime_dir: true
  # Optional granular overrides:
  # work_dir: /mnt/ceph/aspire/nf_work
  # conda_cache_dir: /shared/aspire/conda_cache

resources:
  sample_threads: 1  # FASTP/MERGE/FILTER threads per sample
  analysis_threads: 25
  max_parallel_sample_tasks: 32
  single_end: false

filename_patterns:
  r1_tokens:
    - R1
    - 1
  r2_tokens:
    - R2
    - 2
  ext_patterns:
    - "\\.fastq\\.gz$"
    - "\\.fq\\.gz$"
    - "\\.fastq$"
    - "\\.fq$"
  sample_strip_regex: "(_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$"

fastp:
  trim_front_r1: 19
  trim_tail_r1: 20
  trim_front_r2: 20
  trim_tail_r2: 20

merge:
  max_diffs: 20
  min_overlap: 5
  trunc_quality: 5
  allow_stagger: true

table_filter:
  min_sample_sum: 5000
  min_asv_sum: 0

filter:
  max_ee: 1.0
  min_len: 245
  max_len: 1500

concat:
  relabel: true
  label_sep: ":"

unoise:
  min_size: 3

swarm:
  distance: 1

sina:
  reference:
  reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
  download_subdir: sina_reference
  regions:
    - V4-V5
    - V5
    - V4
  trim_to: V4-V5
  batch_size: 1000000
  keep_gaps: false
  threads: 25
  verbose: false

taxonomy:
  ref_taxonomy:
  ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
  ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
  ref_sequences:
  ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
  ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
  download_subdir: taxonomy_reference
  output_dir: taxonomy
  output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
  stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
  uppercase_fasta: ASVs.upper.fasta
  threads: 25

mito:
  enabled: true
  run_mitomaster: true
  chunk_dir:
  chunk_size: 10
  mitomaster_workers: 8
  mitomaster_retries: 4
  mitomaster_timeout: 90
  mitomaster_header_mode: first
  output_dir: mito/mitomap
  prefix: nontarget
  formats: svg,pdf
  min_pident: 97.0
  min_percov: 51.0
  mitochondria_substring: mitochondria
  feature_col: "Feature ID"
  taxon_col: Taxon
  consensus_col: Consensus
  steps: "BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito"
  host_first_step: BioFactorial
  figsize: 10x6
  style: whitegrid
  dpi: 300
  no_plots: false
  blast_threads: 25
  mito_db: /abs/path/blastdb/mito_ncbi
  biof_db: /abs/path/blastdb/ssu_pipeline_contaminants
  # FASTA alternatives; when set, these take precedence over database prefixes.
  mito_fasta:
  contaminant_fasta:

filter_counts:
  enabled: true
  metadata: /abs/path/metadata.tsv
  output: ASV_target.tsv
  group_col: Type_Group
  min_group_size: 3
  abundance_threshold: 0.5
  sample_id_col: Sample
  min_consensus: 0.0
  exclude_taxa:
    - "Species:Homo sapiens"
    - "Class:Mammalia"
  taxon_col: Taxon
  consensus_col: Consensus
  biofactorial_col: BioFactorial
  mito_cols:
    - MITOMASTER
    - BLAST_mito
