core:
  paths:
    input_dir: /abs/path/input_fastqs
    output_dir: /abs/path/output_dir
    manifest: /abs/path/sample_manifest.tsv
    runtime_dir: /abs/path/output_dir/.aspire
    keep_runtime_dir: true
    work_dir: null
    conda_cache_dir: null
  resources:
    threads: 6
    single_end: false
  filename_patterns:
    r1_tokens:
    - R1
    - 1
    r2_tokens:
    - R2
    - 2
    ext_patterns:
    - \.fastq\.gz$
    - \.fq\.gz$
    - \.fastq$
    - \.fq$
    sample_strip_regex: (_S[0-9]+)?(_L[0-9]{3})?(_R[12])?(_[12])?(_001)?$
  # Sequence-aware paired primer trimming before fastp, enabled in this template.
  # Select primers for your assay; fixed fastp clipping stays at zero.
  primer_trimming:
    enabled: true
    primers:
    - name: 515F_806R
      forward: GTGYCAGCMGCCGCGGTAA
      reverse: GGACTACNVGGGTWTCTAAT
    - name: 515F_926R
      forward: GTGYCAGCMGCCGCGGTAA
      reverse: CCGYCAATTYMTTTRAGTTT
    sample_reads: 5000
    max_prefix: 12
    min_pair_fraction: 0.5
    min_family_fraction: 0.01
    min_family_reads: 5
    screen_error_rate: 0.0  # Exact IUPAC screening; allow substitutions for noisy primer reads if justified.
    error_rate: 0.1
    end_overlap: 12
    minimum_length: 1
  fastp:
    trim_front_r1: 0
    trim_tail_r1: 0
    trim_front_r2: 0
    trim_tail_r2: 0
  merge:
    max_diffs: 20
    min_overlap: 5
    trunc_quality: 5
    allow_stagger: true
  # Initial abundance/nonzero step inside FILTER_ASVS. Depth is bypassed when control_decontam is enabled.
  table_filter:
    min_sample_reads: 5000
    min_relative_abundance_pct: 0
    script: processes/filter_table/filter_ASV_table.py
  filter:
    max_ee: 1.0
    min_len: 245
    max_len: 1500
  concat:
    relabel: true
    label_sep: ':'
  unoise:
    min_size: 3
  swarm:
    distance: 1
  sina:
    reference: null
    reference_url: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/ARB_files/SILVA_138.2_SSURef_NR99_03_07_24_opt.arb.gz
    download_subdir: sina_reference
    regions:
    - V4-V5
    - V5
    - V4
    trim_to: V4-V5
    batch_size: 1000000
    keep_gaps: false
    threads: 6
    verbose: false
  taxonomy:
    ref_taxonomy: null
    ref_taxonomy_url: https://data.qiime2.org/2024.10/common/silva-138-99-tax.qza
    ref_taxonomy_filename: silva-138_2-ssu-nr99-tax.qza
    ref_sequences: null
    ref_sequences_url: https://data.qiime2.org/2024.10/common/silva-138-99-seqs.qza
    ref_sequences_filename: silva-138_2-ssu-nr99-seqs-DNA.qza
    download_subdir: taxonomy_reference
    output_dir: taxonomy
    output_tsv: ASV_SILVA_tax.full-length.vsearch.tsv
    stats_tsv: ASV_SILVA_stats.full-length.vsearch.tsv
    uppercase_fasta: ASVs.upper.fasta
    threads: 6
  # Set the metadata class column/labels below; disable an arm if that control class is absent.
  control_decontam:
    enabled: true
    metadata: null
    metadata_sample_col: Sample
    # Biological inclusion only: controls are NEVER filtered at this depth.
    min_biological_reads: 5000
    class_col: sample_class
    biological_labels: [biological]
    technical_labels: [technical]
    bio_control_labels: [bio_control]
    positive_labels: [positive]
    # Disable the unused arm when only TECH or only BIO controls are supplied.
    technical_enabled: true
    bio_control_enabled: true
    # Remove ASVs with decontam prevalence score < threshold in either arm.
    technical_score_threshold: 0.1
    bio_control_score_threshold: 0.1
standard:
  mito:
    enabled: true
    run_mitomaster: true
    chunk_dir: null
    chunk_size: 10
    mitomaster_workers: 8
    mitomaster_retries: 4
    mitomaster_timeout: 90
    mitomaster_header_mode: first
    mitomaster_failure_policy: continue  # Audit API failures and preserve local BLAST screening.
    output_dir: mito/mitomap
    prefix: nontarget
    formats: svg,pdf
    min_pident: 97.0
    min_percov: 51.0
    mitochondria_substring: mitochondria
    feature_col: Feature ID
    taxon_col: Taxon
    consensus_col: Consensus
    steps: BioFactorial,Qiime_NB_FULL,MITOMASTER,BLAST_mito
    host_first_step: BioFactorial
    figsize: 10x6
    style: whitegrid
    dpi: 300
    no_plots: false
    blast_threads: 6
    mito_db: /abs/path/blastdb/mito_ncbi
    biof_db: /abs/path/blastdb/ssu_pipeline_contaminants
    mito_fasta: null
    contaminant_fasta: null
  # Group, taxonomy and reference filters in FILTER_ASVS, immediately before metadata plots.
  filter_counts:
    enabled: true
    metadata: /abs/path/metadata.tsv
    output: ASV_target.tsv
    group_col: Type_Group
    min_group_size: 3
    min_relative_abundance_pct: 0.1
    min_prevalence_fraction: 0.05  # Nonzero presence in biological samples; 0.05 = 5%.
    biological_only_input: false  # Set true only when controls are absent and all input samples are biological.
    sample_id_col: Sample
    min_consensus: 0.05
    exclude_taxa:
    - Species:Homo sapiens
    - Class:Mammalia
    - Phylum:Vertebrata
    taxon_col: Taxon
    consensus_col: Consensus
    biofactorial_col: BioFactorial
    mito_cols:
    - MITOMASTER
    - BLAST_mito
    save_intermediates: true
    mito_output_dir: mito/ASVs
  general_stats:
    enabled: true
  metadata_plots:
    enabled: true
    metadata: /abs/path/metadata.tsv
    sub_dir: .
    sample_col: Sample
    type_col: Type_Group
    color_col: Color
    palette_file: null
    keep_types:
    - Oral Rinse
    - BAL
    - Bronchial Brush
    group_order:
    - Oral Rinse
    - BAL
    - Bronchial Brush
    include_rank: []
    input_table: filtered
    min_pre_correction_sample_sum: 0
    drop_zero_asvs: false
    run_micro: true
    run_mito: true
    group_normalization:
      enabled: false
      columns: []
      pattern: null
      replacement: outlier
      preserve_source: true
